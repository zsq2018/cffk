name: Update CFFK

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: update-cffk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          # Keep instance-specific files: Cloudflare bindings and this workflow.
          if [ -f wrangler.jsonc ]; then
            cp wrangler.jsonc "$RUNNER_TEMP/wrangler.current.jsonc"
          fi
          mkdir -p "$RUNNER_TEMP/keep/.github/workflows"
          if [ -f .github/workflows/update-cffk.yml ]; then
            cp .github/workflows/update-cffk.yml "$RUNNER_TEMP/keep/.github/workflows/update-cffk.yml"
          fi

          git fetch https://github.com/34892002/cffk.git main
          git reset --hard FETCH_HEAD
          upstream_sha="$(git rev-parse --short HEAD)"

          if [ -f "$RUNNER_TEMP/wrangler.current.jsonc" ]; then
            cp "$RUNNER_TEMP/wrangler.current.jsonc" wrangler.jsonc
          fi
          if [ -f "$RUNNER_TEMP/keep/.github/workflows/update-cffk.yml" ]; then
            mkdir -p .github/workflows
            cp "$RUNNER_TEMP/keep/.github/workflows/update-cffk.yml" .github/workflows/update-cffk.yml
          fi

          git config user.name "CFFK Updater"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "CFFK is already up to date."
          else
            git add -A
            git commit -m "Update CFFK to ${upstream_sha}"
          fi

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
